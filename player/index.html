<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Last.fm — mini player</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Arimo:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --red: #ff3b47;
    --muted: #beaaac;
    --wheel-ink: #8f8f8f;
    --w: 440px; --h: 210px; --pad: 14px; --gap: 14px; --screen-w: 248px; --wheel: 150px; --btn: 56px; --cover: 60px;
    --f-bar: 11px; --f-title: 16px; --f-artist: 13px; --f-row: 12px; --f-wheel: 14px; --radius: 20px;
  }
  /* o tamanho pequeno entra quando a janela/iframe tem 449px ou menos */
  @media (max-width: 449px) {
    :root { --w: 340px; --h: 162px; --pad: 10px; --gap: 10px; --screen-w: 200px; --wheel: 110px; --btn: 40px; --cover: 46px;
            --f-bar: 10px; --f-title: 14px; --f-artist: 12px; --f-row: 11px; --f-wheel: 11px; --radius: 16px; }
    .track { -webkit-line-clamp: 1; }
    .screen { gap: 3px; }
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { background: transparent; }
  /* pensado para ficar dentro de um iframe: sem margens grandes, só espaço para a sombra */
  body { font-family: Arimo, Arial, Helvetica, sans-serif; display: flex; justify-content: center; padding: 8px 8px 28px; overflow: hidden; }

  /* corpo do iPod */
  .ipod { width: var(--w); height: var(--h); padding: var(--pad); display: flex; align-items: center; gap: var(--gap);
          border-radius: var(--radius); border: 1px solid #bebebe; background: linear-gradient(#f0f0f0, #d4d4d4);
          box-shadow: 0 8px 16px rgba(0,0,0,.2); flex: none; }

  /* tela */
  .bezel { flex: none; width: var(--screen-w); height: 100%; padding: 3px; background: #111; border-radius: 8px; }
  .screen { height: 100%; padding: 8px; border-radius: 5px; overflow: hidden; color: #fff;
            background: linear-gradient(#3b0a0f, #120508); display: flex; flex-direction: column; gap: 6px; }
  .bar { display: flex; justify-content: space-between; align-items: center; font-size: var(--f-bar); font-weight: 700; line-height: 1; text-transform: uppercase; white-space: nowrap; }
  .status { color: var(--red); min-width: 0; overflow: hidden; text-overflow: clip; }
  .status.off { color: var(--muted); }
  /* "ESCUTANDO AGORA, EM TEMPO REAL": linha inteira só para o status, em vermelho, com bolinha piscando */
  .bar.live { justify-content: flex-start; }
  .status .dot { display: inline-block; width: .7em; height: .7em; margin-right: .45em; border-radius: 50%; background: currentColor; vertical-align: -.02em; animation: blink 1.1s ease-in-out infinite; }
  .bar.count { color: var(--muted); }
  .main { display: flex; gap: 8px; align-items: flex-start; flex: none; }
  .cover { flex: none; width: var(--cover); height: var(--cover); border-radius: 3px; background: #ededed; overflow: hidden; display: grid; place-items: center; color: #8c8c8c; font-weight: 700; font-size: calc(var(--cover) * .4); }
  .cover img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .cover img + span { display: none; }
  .info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
  .track { font-size: var(--f-title); font-weight: 700; line-height: 1; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  @media (max-width: 449px) { .track { -webkit-line-clamp: 1; } } /* a regra do bloco acima perdia para esta (ordem no CSS); aqui vale o 1 linha pretendido no tamanho pequeno */
  .artist { font-size: var(--f-artist); line-height: 1; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .eq { display: flex; align-items: flex-end; gap: 2px; height: 15px; }
  .eq i { width: 3px; background: var(--red); height: var(--h); animation: bounce 900ms ease-in-out infinite alternate; animation-delay: var(--d); }
  .eq.paused i { animation-play-state: paused; background: var(--muted); }
  hr { border: 0; height: 1px; background: #462d30; flex: none; }
  .recent { list-style: none; padding: 0; display: flex; flex-direction: column; gap: 3px; font-size: var(--f-row); line-height: 1; }
  .recent li { display: flex; gap: 6px; align-items: center; }
  .recent .n, .recent .t { color: var(--muted); flex: none; }
  .recent .x { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* click wheel */
  .wheel { flex: none; width: var(--wheel); height: var(--wheel); border-radius: 50%; background: #fafafa; border: 1px solid #d4d4d4;
           padding: 12px; display: flex; flex-direction: column; justify-content: space-between; align-items: center; color: var(--wheel-ink); }
  .wheel .label { font-size: var(--f-wheel); font-weight: 700; line-height: 1; }
  .wheel .mid { align-self: stretch; display: flex; justify-content: space-between; align-items: center; }
  .wheel svg { display: block; fill: var(--wheel-ink); height: calc(var(--f-wheel) * .86); width: auto; }
  .wheel a.center { width: var(--btn); height: var(--btn); border-radius: 50%; background: #e9e9e9; border: 1px solid #d0d0d0; display: block; }

  @keyframes bounce { from { height: 4px; } to { height: var(--h); } }
  @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: .25; } }
  @media (prefers-reduced-motion: reduce) { .eq i, .status .dot { animation: none !important; } }
</style>
</head>
<body>
<section class="ipod" aria-label="O que estou ouvindo no Last.fm">
  <div class="bezel"><div class="screen">
    <div class="bar live"><span class="status off" id="status">● Carregando</span></div>
    <div class="bar count"><span id="scrobbles">— scrobbles</span></div>
    <div class="main">
      <div class="cover" id="cover"><span>♫</span></div>
      <div class="info" aria-live="polite">
        <div class="track" id="track">—</div>
        <div class="artist" id="artist"></div>
        <div class="eq paused" id="eq" aria-hidden="true">
          <i style="--h:6px;--d:-.1s"></i><i style="--h:13px;--d:-.5s"></i><i style="--h:8px;--d:-.3s"></i><i style="--h:15px;--d:-.7s"></i><i style="--h:9px;--d:-.2s"></i><i style="--h:12px;--d:-.6s"></i>
        </div>
      </div>
    </div>
    <hr>
    <ol class="recent" id="recent"></ol>
  </div></div>

  <div class="wheel" aria-hidden="true">
    <span class="label">MUSIC</span>
    <div class="mid">
      <svg viewBox="0 0 18 12"><path d="M9 0v12L0 6l9-6zM18 0v12L9 6l9-6z"/></svg>
      <a class="center" id="profile" href="#" target="_blank" rel="noopener" aria-label="Abrir perfil no Last.fm"></a>
      <svg viewBox="0 0 18 12"><path d="M9 0v12l9-6L9 0zM0 0v12l9-6L0 0z"/></svg>
    </div>
    <svg viewBox="0 0 20 12"><path d="M0 0v12l9-6L0 0z"/><rect x="12" width="3" height="12"/><rect x="17" width="3" height="12"/></svg>
  </div>
</section>

<script>
/* ============ CONFIGURAÇÃO ============ */
const LASTFM_USER    = 'mxtheuso';
const LASTFM_API_KEY = '4ae249779be139cb95932c838b926f5a'; // chave pública de leitura (a "shared secret" NÃO entra aqui)
const POLL_MS        = 15000;                                // a cada quantos ms consulta o Last.fm
/* ====================================== */

const $ = id => document.getElementById(id);
const PLACEHOLDER = '2a96cbd8b46e442fc41c2b86b821562f'; // capa "estrela" padrão do Last.fm
const MOCK = new URLSearchParams(location.search).get('mock'); // ?mock=1 (tocando) | ?mock=0 (offline)

$('profile').href = 'https://www.last.fm/user/' + LASTFM_USER;

function coverUrl(track) {
  const imgs = track.image || [];
  const pick = imgs.find(i => i.size === 'extralarge') || imgs[imgs.length - 1];
  const url = pick && pick['#text'];
  return url && !url.includes(PLACEHOLDER) ? url : '';
}

function setCover(el, url, alt) {
  el.querySelector('img')?.remove();
  if (!url) return;
  const img = new Image();
  img.alt = alt || '';
  img.referrerPolicy = 'no-referrer';
  img.onerror = () => img.remove();
  img.src = url;
  el.prepend(img);
}

function ago(uts) {
  const s = Math.max(0, Math.floor(Date.now() / 1000) - Number(uts));
  const m = Math.floor(s / 60);
  if (m < 1) return 'agora';
  if (m < 60) return m + 'm';
  const h = Math.floor(m / 60);
  if (h < 24) return h + 'h';
  return Math.floor(h / 24) + 'd';
}

/* garante que o texto do status caiba inteiro numa linha (reduz a fonte se preciso) */
function fitStatus() {
  const st = $('status');
  st.style.fontSize = '';
  let size = parseFloat(getComputedStyle(st).fontSize);
  while (st.scrollWidth > st.clientWidth + 0.5 && size > 6) { size -= 0.25; st.style.fontSize = size + 'px'; }
}

function render(data) {
  const rt = data.recenttracks;
  const tracks = [].concat(rt.track || []);
  if (!tracks.length) return;
  const cur = tracks[0];
  const playing = !!(cur['@attr'] && cur['@attr'].nowplaying === 'true');

  $('track').textContent  = cur.name;
  $('artist').textContent = cur.artist['#text'] || cur.artist.name || '';
  setCover($('cover'), coverUrl(cur), cur.name);
  $('scrobbles').textContent = Number(rt['@attr'].total).toLocaleString('pt-BR') + ' scrobbles';

  const st = $('status');
  st.classList.toggle('off', !playing);
  if (playing) st.innerHTML = '<i class="dot"></i>ESCUTANDO AGORA, EM TEMPO REAL';
  else st.textContent = '❚❚ ' + (cur.date ? ago(cur.date.uts) : 'offline');
  fitStatus();
  $('eq').classList.toggle('paused', !playing);

  const ol = $('recent');
  ol.replaceChildren();
  tracks.slice(1, 4).forEach((t, i) => {
    const li = document.createElement('li');
    const n = document.createElement('span'); n.className = 'n'; n.textContent = String(i + 1);
    const x = document.createElement('span'); x.className = 'x';
    x.textContent = t.name + ' — ' + (t.artist['#text'] || t.artist.name || '');
    const w = document.createElement('span'); w.className = 't'; w.textContent = t.date ? ago(t.date.uts) : '';
    li.append(n, x, w);
    ol.append(li);
  });
}

function mockData(playing) {
  const now = Math.floor(Date.now() / 1000);
  const mk = (name, artist, mins) => ({ name, artist: { '#text': artist }, album: { '#text': 'Álbum de exemplo' }, image: [], date: { uts: now - mins * 60 } });
  const first = mk('Nome da música bem longa para testar quebra de linha', 'Artista de exemplo', 0);
  if (playing) { first['@attr'] = { nowplaying: 'true' }; delete first.date; } else first.date.uts = now - 12 * 60;
  return { recenttracks: { '@attr': { total: '53570' }, track: [first, mk('Segunda faixa', 'Artista B', 4), mk('Terceira faixa', 'Artista C', 9), mk('Quarta faixa', 'Artista D', 15)] } };
}

async function load() {
  if (MOCK !== null) return render(mockData(MOCK !== '0'));
  try {
    const url = 'https://ws.audioscrobbler.com/2.0/?method=user.getrecenttracks&user=' + encodeURIComponent(LASTFM_USER)
      + '&api_key=' + encodeURIComponent(LASTFM_API_KEY) + '&format=json&limit=5&extended=0';
    const res = await fetch(url, { cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    if (data.error) throw new Error(data.message);
    render(data);
  } catch (e) {
    const st = $('status'); st.classList.add('off'); st.textContent = '● Sem sinal';
    console.warn('[last.fm]', e);
  }
}

load();
let timer = setInterval(load, POLL_MS);
document.addEventListener('visibilitychange', () => {
  clearInterval(timer);
  if (!document.hidden) { load(); timer = setInterval(load, POLL_MS); }
});
</script>
</body>
</html>
